[tool.ruff]
line-length = 200
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends(...) default is the standard idiom, not a bug

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ011", "C408"]
"tests/conftest.py" = ["DTZ011", "C408", "E402"]  # env vars must be set before app.* is imported

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
